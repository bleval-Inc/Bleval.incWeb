<!-- ═══════════════════════════════════════════════════════════════
     BLEVAL.INC — MAIN APP SHELL
     ═══════════════════════════════════════════════════════════════ -->

<!-- Background layer -->
<div class="bg">
  <div class="mesh"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
</div>

<!-- Custom Cursor -->
<div id="cursor" class="cursor" aria-hidden="true"></div>

<div class="page-wrapper">
  <div class="main-content" id="mainContent">
    <app-navbar></app-navbar>

    <main class="page-enter">
      <router-outlet></router-outlet>
    </main>
  </div>

  <app-footer class="footer-layer" id="footerLayer"></app-footer>
</div>

<!-- Floating Actions -->
<div class="floating-actions">
  <app-chatbot></app-chatbot>

  <!-- BOOKING BUTTON -->
  <button
    class="fab fab-booking"
    type="button"
    title="Book a service"
    aria-label="Book a service"
    (click)="toggleBookingPopup()"
  >
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1 .9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zm-7-9h5v5h-5z"/>
    </svg>
  </button>

  <!-- CONTACT BUTTON -->
  <a
    routerLink="/contact"
    class="fab fab-contact"
    title="Contact us"
    aria-label="Contact us"
  >
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
    </svg>
  </a>

  <!-- SCROLL -->
  <button
    class="fab fab-scroll"
    title="Scroll to top"
    (click)="scrollToTop()"
    [class.visible]="isScrolled()"
    aria-label="Scroll to top"
  >
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 5l-7 7h4v7h6v-7h4l-7-7z"/>
    </svg>
  </button>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     BOOKING MODAL
     ═══════════════════════════════════════════════════════════════ -->

<div
  class="booking-modal-backdrop"
  *ngIf="bookingOpen()"
  (click)="closeBookingPopup()"
>
  <div class="booking-modal" (click)="$event.stopPropagation()">


    <!-- HEADER -->

    <div class="booking-modal-header">
      <div>
        <p class="overline">Book a Service</p>
        <h3 class="h3">Request a Consultation</h3>
      </div>


      <button
        type="button"
        class="modal-close"
        aria-label="Close booking form"
        (click)="closeBookingPopup()"
      >
        ×
      </button>
    </div>

    <!-- BODY -->
    <div class="booking-modal-body">

      <form (ngSubmit)="submitBooking()">

        <!-- NAME -->
        <label class="field-label">
          Full Name
          <input
            type="text"
            [(ngModel)]="bookingName"
            name="bookingName"
            placeholder="Your full name"
            required
          />
        </label>

        <!-- EMAIL -->
        <label class="field-label">
          Email Address
          <input
            type="email"
            [(ngModel)]="bookingEmail"
            name="bookingEmail"
            placeholder="your@email.com"
            required
          />
        </label>

        <!-- PHONE -->
        <label class="field-label">
          Contact Number
          <input
            type="tel"
            [(ngModel)]="bookingPhone"
            name="bookingPhone"
            placeholder="+27 67 000 0000"
            required
          />
        </label>

        <!-- SERVICE -->
        <label class="field-label">
          Service Required
          <select
            [(ngModel)]="bookingService"
            name="bookingService"
            required
          >
            <option value="" disabled selected>
              Select a service
            </option>

            <option
              *ngFor="let option of serviceOptions"
              [value]="option"
            >
              {{ option }}
            </option>
          </select>
        </label>




        <!-- PROJECT DETAILS -->
        <label class="field-label">
          Project Details
          <textarea
            [(ngModel)]="bookingMessage"
            name="bookingMessage"
            placeholder="Tell us about your project"
            rows="5"
            required
          ></textarea>
        </label>

        <!-- SUBMIT -->

        <button
          type="submit"
          class="btn btn-primary booking-submit"
          [disabled]="
            bookingLoading() ||
            !bookingName?.trim() ||
            !bookingEmail?.trim() ||
            !bookingPhone?.trim() ||
            !bookingService ||
            !bookingMessage?.trim()
          "
        >
          {{
            bookingLoading()
              ? 'Submitting...'
              : bookingSuccess()
              ? 'Request Submitted'
              : 'Submit Booking'
          }}
        </button>


      </form>

      <!-- SUCCESS -->
      <div
        class="booking-feedback success"
        *ngIf="bookingSuccess()"
      >
        <p>
          Thank you for your enquiry.
           <!-- Your booking request has been received successfully
          and a Bleval.inc strategist will review your submission shortly.
          We will contact you via email or phone within 1–2 business days to discuss your project and next steps. -->
        </p>
      </div> 

      <!-- ERROR -->
      <div
        class="booking-feedback error"
        *ngIf="bookingError()"
      >
        <p>
          We were unable to submit your booking request.
          Please try again or contact us directly at bleval.inc@gmail.com.
        </p>
      </div>


    </div>
  </div>
</div>

<app-toast></app-toast>
